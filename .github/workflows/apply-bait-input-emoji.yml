name: Apply bait input and emoji speakers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-bait-input-emoji.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(src, old, new, label):
              count = src.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              return src.replace(old, new, 1)

          # 다른 사람의 말을 흉내 내는 부분은 역할명 대신 표정 이모지로 표시한다.
          text = replace_once(
              text,
              "{ l: '남의 인정도 필요하다', s: 0, f: 'smile', m: ['상대 : 그래그래 너 잘하고 있어. 됐니?'] }",
              "{ l: '남의 인정도 필요하다', s: 0, f: 'smile', m: ['😮‍💨 : 그래그래 너 잘하고 있어. 됐니?'] }",
              'Q2 emoji speaker'
          )
          text = replace_once(
              text,
              "{ l: '그건 그 사람의 감정이다', s: 1, f: 'sparkle', m: ['상대 : 나 그럼 너 맘껏 싫어해도 돼?'] }",
              "{ l: '그건 그 사람의 감정이다', s: 1, f: 'sparkle', m: ['🤩 : 나 그럼 너 맘껏 싫어해도 돼?'] }",
              'Q8 emoji speaker'
          )
          text = replace_once(
              text,
              "{ l: '별로 주눅 들지 않는다', s: 1, f: 'smile', m: ['상대방: [w:“네? 그런 사람이 있었나요?”]'] }",
              "{ l: '별로 주눅 들지 않는다', s: 1, f: 'smile', m: ['😊 : [w:“네? 그런 사람이 있었나요?”]'] }",
              'Q25 emoji speaker'
          )
          text = replace_once(
              text,
              "{ l: '어떻게든 해낼 것이다', s: 1, f: 'smile', m: ['[w:“이거 이렇게 하시면 다른 사람이 다 다시 해야 돼요…”]'] }",
              "{ l: '어떻게든 해낼 것이다', s: 1, f: 'smile', m: ['😑 : [w:“이거 이렇게 하시면 다른 사람이 다 다시 해야 돼요…”]'] }",
              'Q27A emoji speaker'
          )
          text = replace_once(
              text,
              "{ l: '잘 해낼 자신이 없다', s: 0, f: 'deadpan', m: ['자신이 있는지 없는지는 안 궁금하고요.', '언제까지 끝내실 건데요?'] }",
              "{ l: '잘 해낼 자신이 없다', s: 0, f: 'deadpan', m: ['🧑‍💼 : 자신이 있는지 없는지는 안 궁금하고요.', '언제까지 끝내실 건데요?'] }",
              'Q27B emoji speaker'
          )
          text = replace_once(
              text,
              "{ l: '일단 의견을 말한다', s: 1, f: 'smile', m: ['[w:“저기, 저분 꼭 회의에 들어와야 되나요?”]'] }",
              "{ l: '일단 의견을 말한다', s: 1, f: 'smile', m: ['🙋 : [w:“저기, 저분 꼭 회의에 들어와야 되나요?”]'] }",
              'Q29 emoji speaker'
          )

          # 23번: 말해 보라고 입력창을 내민 뒤, 누르는 순간 치워 버린다.
          text = replace_once(
              text,
              "{ l: '몇 가지 있다', s: 1, f: 'happy', m: ['안 궁금하네요^^', { f: 'smile', t: '내세우지 마세요.' }] }",
              "{ l: '몇 가지 있다', s: 1, f: 'happy', m: [{ k: 'bait-input', ask: '우와, 어떤 건지 말해줄 수 있어요?', cut: '근데 안 궁금하네요^^' }] }",
              'Q23 bait input data'
          )

          css_anchor = ".dock-wait i:nth-child(2) { animation-delay: .15s; } .dock-wait i:nth-child(3) { animation-delay: .3s; }\n.choice {"
          css_insert = ".dock-wait i:nth-child(2) { animation-delay: .15s; } .dock-wait i:nth-child(3) { animation-delay: .3s; }\n.fake-input {\n  width: 100%; min-height: 58px;\n  display: flex; align-items: center; gap: 7px;\n  padding: 0 18px;\n  border: 0; border-radius: 20px;\n  background: #fff; color: #A99DB5;\n  box-shadow: inset 0 0 0 1.8px #F4C3D5, 0 4px 12px rgba(92, 44, 88, .07);\n  font: inherit; font-size: 16px; font-weight: 650; text-align: left;\n  animation: rise-in .3s cubic-bezier(.2,1.2,.4,1) both;\n  transition: transform .08s ease, box-shadow .08s ease;\n}\n.fake-input .fake-caret {\n  width: 2px; height: 21px; flex: none; border-radius: 2px;\n  background: var(--pink); animation: fake-caret 1s steps(1, end) infinite;\n}\n.fake-input:active, .fake-input.pressed {\n  transform: translateY(1px) scale(.99);\n  box-shadow: inset 0 0 0 2.2px var(--pink), 0 2px 7px rgba(92, 44, 88, .08);\n}\n@keyframes fake-caret { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }\n.choice {"
          text = replace_once(text, css_anchor, css_insert, 'fake input CSS')

          js_anchor = "function dockReady() { return dock.dataset.ready === '1'; }\n\nfunction divider(n, title) {"
          js_insert = "function dockReady() { return dock.dataset.ready === '1'; }\n\nfunction fakeInputCutoff(label = '여기에 적어 주세요') {\n  return new Promise(resolve => {\n    dock.innerHTML = `<button class=\"fake-input\" type=\"button\" aria-label=\"내 장점 입력\"><i class=\"fake-caret\" aria-hidden=\"true\"></i><span>${esc(label)}</span></button>`;\n    const b = dock.firstElementChild;\n    b.addEventListener('click', async () => {\n      if (!dockReady()) return;\n      dock.dataset.ready = '0';\n      b.classList.add('pressed');\n      SFX.play('tap');\n      await wait(90);\n      dockWait();\n      await wait(190);\n      resolve();\n    }, { once: true });\n    armDock();\n  });\n}\n\nfunction divider(n, title) {"
          text = replace_once(text, js_anchor, js_insert, 'fake input function')

          say_anchor = "async function say(raw, defFace) {\n  const msg = typeof raw === 'string' ? { t: raw } : raw;\n  if (msg.k === 'notify') {"
          say_insert = "async function say(raw, defFace) {\n  const msg = typeof raw === 'string' ? { t: raw } : raw;\n  if (msg.k === 'bait-input') {\n    await say({ t: msg.ask, f: 'sparkle' }, defFace);\n    endGroup();\n    await fakeInputCutoff(msg.placeholder || '여기에 적어 주세요');\n    await say({ t: msg.cut, f: 'deadpan' }, defFace);\n    return;\n  }\n  if (msg.k === 'notify') {"
          text = replace_once(text, say_anchor, say_insert, 'bait input say handler')

          # 형광펜 표시는 전역에서 없애되 손글씨 등 다른 서식은 유지한다.
          text = replace_once(
              text,
              "const el = document.createElement(m[1].includes('h') ? 'mark' : 'span');",
              "const el = document.createElement('span');",
              'disable highlighter element'
          )
          text = replace_once(
              text,
              "const flags = str => { const f = new Set(); String(str).replace(MARK, (_, a) => { [...a].forEach(x => f.add(x)); return ''; }); return f; };",
              "const flags = str => { const f = new Set(); String(str).replace(MARK, (_, a) => { [...a].forEach(x => { if (x !== 'h') f.add(x); }); return ''; }); return f; };",
              'ignore highlighter flag'
          )
          text = replace_once(
              text,
              "  if (f.has('h')) SFX.play('marker');\n  else if (f.has('w')) SFX.play('scribble');\n  if (f.has('w') && f.has('h')) setTimeout(() => SFX.play('scribble'), 200);",
              "  if (f.has('w')) SFX.play('scribble');",
              'remove highlighter sound'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit updated page
        shell: bash
        run: |
          rm -f .github/workflows/apply-bait-input-emoji.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-bait-input-emoji.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add bait input and emoji speakers"
          git push
