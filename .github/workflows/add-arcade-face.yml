name: Add hidden arcade face links

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-arcade-face.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: python .github/patch_arcade.py

      - name: Commit updated page
        shell: bash
        run: |
          rm -f .github/workflows/add-arcade-face.yml .github/patch_arcade.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-arcade-face.yml .github/patch_arcade.py
          git diff --cached --quiet && exit 0
          git commit -m "Add hidden arcade face links"
          git push
