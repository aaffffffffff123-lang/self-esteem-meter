name: Add hidden arcade face links

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-arcade-face.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'arcade-face--chat' in text:
              raise RuntimeError('Arcade face links already exist')

          face_svg = '''<svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M24 3.2C30 3.3 36.8 5.8 40.5 10.5C44 14.9 45.7 22.5 44.5 28.5C43.2 34.7 38.7 39.6 33 42.3C27.4 45 20.9 45.8 15.1 43.2C9.2 40.6 5.1 36.6 3.8 30.5C2.5 24.5 3.4 17.4 7.5 12C11.6 6.7 17.9 3.1 24 3.2Z" fill="#FF5F91" stroke="#7A355E" stroke-width="1.5"/>
            <path d="M12.9 9.5v8.1M20 7.2v9.5M27.4 6.4v10.1M35 9v9" fill="none" stroke="#FFF6F9" stroke-width="2.25" stroke-linecap="round"/>
            <ellipse cx="18.1" cy="24.7" rx="2.15" ry="2.5" fill="#FFF6F9"/>
            <ellipse cx="29.9" cy="25.5" rx="2.15" ry="2.5" fill="#FFF6F9"/>
            <path d="M19.5 32.1Q24.2 36.2 29 31.7" fill="none" stroke="#FFF6F9" stroke-width="2.35" stroke-linecap="round"/>
            <path d="M8.8 18.2Q11.2 9.7 18.7 6.6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".28"/>
          </svg>'''

          def arcade_link(kind: str) -> str:
              return f'''<a class="arcade-face arcade-face--{kind}" href="https://aaffffffffff123-lang.github.io/arcade/" target="_blank" rel="noopener noreferrer" aria-label="다른 게임 보기">
        {face_svg}
      </a>'''

          css = '''
/* 화면에 숨어 있는 오락실 얼굴 */
.arcade-face {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  opacity: .86;
  z-index: 8;
}
.arcade-face svg {
  width: 38px; height: 38px;
  overflow: visible;
  transform: rotate(-6deg);
  transform-origin: 50% 50%;
  filter: drop-shadow(0 3px 0 rgba(122,53,94,.13)) drop-shadow(0 7px 12px rgba(184,71,123,.16));
  transition: transform .12s ease, filter .12s ease, opacity .12s ease;
}
.arcade-face:active svg {
  transform: rotate(-6deg) scale(.82, .88);
  filter: drop-shadow(0 1px 0 rgba(122,53,94,.13));
}
.arcade-face:focus-visible { outline: 3px solid var(--lilac); outline-offset: 1px; }
.welcome .appbar { justify-content: space-between; }
.chat-head { position: relative; }
.arcade-face--chat {
  position: absolute;
  left: 50%;
  top: calc(11px + env(safe-area-inset-top, 0px));
  width: 42px; height: 42px;
  transform: translateX(-50%);
}
.arcade-face--chat svg { width: 31px; height: 31px; }
.arcade-face--outro {
  position: absolute;
  left: 14px;
  bottom: calc(11px + env(safe-area-inset-bottom, 0px));
}
.result-scroll { padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px)); }
@media (hover: hover) {
  .arcade-face:hover { opacity: 1; }
  .arcade-face:hover svg { transform: rotate(-9deg) translateY(-1px); }
}

'''

          marker = '@media (max-height: 640px) {'
          if text.count(marker) != 1:
              raise RuntimeError('Could not locate CSS insertion marker')
          text = text.replace(marker, css + marker, 1)

          welcome_old = '    <header class="appbar"><button class="icon-btn sound-btn" type="button"></button></header>'
          welcome_new = '''    <header class="appbar">
      ''' + arcade_link('intro') + '''
      <button class="icon-btn sound-btn" type="button"></button>
    </header>'''
          if text.count(welcome_old) != 1:
              raise RuntimeError('Could not locate welcome appbar')
          text = text.replace(welcome_old, welcome_new, 1)

          chat_old = '''      <div class="coach"><div class="avatar" id="head-avatar"></div><div><div class="coach-name">온이</div><div class="coach-sub">마음 코치</div></div></div>
      <div class="spacer"></div>'''
          chat_new = '''      <div class="coach"><div class="avatar" id="head-avatar"></div><div><div class="coach-name">온이</div><div class="coach-sub">마음 코치</div></div></div>
      ''' + arcade_link('chat') + '''
      <div class="spacer"></div>'''
          if text.count(chat_old) != 1:
              raise RuntimeError('Could not locate chat header')
          text = text.replace(chat_old, chat_new, 1)

          result_old = '    <div class="result-scroll" id="result-scroll"></div>\n  </section>'
          result_new = '''    <div class="result-scroll" id="result-scroll"></div>
    ''' + arcade_link('outro') + '''
  </section>'''
          if text.count(result_old) != 1:
              raise RuntimeError('Could not locate result screen')
          text = text.replace(result_old, result_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit updated page
        shell: bash
        run: |
          rm -f .github/workflows/add-arcade-face.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-arcade-face.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add hidden arcade face links"
          git push
