name: Apply self-esteem dialogue update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-self-esteem-update.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          start = text.index("// ===== 문항·대사 =====")
          q_start = text.index("const Q = [", start)
          end = text.index("\n];", q_start) + 3

          new_block = r'''// ===== 문항·대사 =====
// 서식 표기: [w:손글씨]
// big:1 = 뜸 들였다가 툭 던지는 짧은 한마디 (글자는 다른 말풍선과 똑같이)
// 말풍선 종류: 문자열 = 온이 말풍선 / {big:1} 크게 튀어나오는 한 방 / {k:'badge'} 배지 획득 / {k:'aside'} 괄호 속 혼잣말 / {sing:1} 노래
// f = 온이 표정: smile happy deadpan flat sly smug sparkle curious yuck sweat sympathy sad
const Q = [
  { t: '남이 잘한다고 해서 내 가치가 줄어드는 것은 아니다.', c: [
    { l: '내 가치는 흔들리지 않는다', s: 1, f: 'smile', m: ['그쵸, 남의 가치가 올라갈 뿐이지요~'] },
    { l: '가치가 줄어든다고 느낀다', s: 0, f: 'sympathy', m: ['ㄴㄴ. 월급이 줄어드는 게 아니죠.', '물가가 오르는 것이지요~'] } ] },
  { t: '나는 다른 사람의 인정 없이도 나를 인정할 수 있다.', c: [
    { l: '내 인정이면 충분하다', s: 1, f: 'sympathy', m: ['스스로 쫌쫌따리 쌓은 자존감은 자고 일어나면 무너져있습니다'] },
    { l: '남의 인정도 필요하다', s: 0, f: 'smile', m: ['상대 : 그래그래 너 잘하고 있어. 됐니?'] } ] },
  { t: '나는 실수해도 사랑받을 자격이 있다.', c: [
    { l: '실수와 사랑받을 자격은 별개다', s: 1, f: 'happy', m: [{ big: 1, t: '기회는 줄겠지만' }] },
    { l: '실수하면 자격이 줄어든다', s: 0, f: 'sympathy', m: ['당신 역시 다른 모두와 똑같이 사랑받기 위해 태어난 사람입니다.', { f: 'deadpan', t: '누가 줄지는 몰라도.' }] } ] },
  { t: '나는 원하지 않는 부탁을 거절할 수 있다.', c: [
    { l: '싫으면 거절한다', s: 1, f: 'curious', m: ['애초에 싫어할 만한 부탁은 만만한 사람한테만 하죠.'] },
    { l: '싫어도 들어준다', s: 0, f: 'smile', m: ['그거 피해의식이에요'] } ] },
  { t: '나는 모든 사람에게 좋은 사람일 필요가 없다.', c: [
    { l: '모두에게 좋을 필요는 없다', s: 1, f: 'smile', m: ['어차피 아무도 그렇게 생각 안 합니다.'] },
    { l: '모두에게 좋은 사람이고 싶다', s: 0, f: 'sly', m: ['난 좋은 사람이라는 자의식 개역겨운 거 알죠. 그거 다 티나요'] } ] },
  { t: '나는 쉬고 있어도 가치 있는 사람이다.', c: [
    { l: '쉬어도 가치는 그대로다', s: 1, f: 'curious', m: ['퇴근해서 쉬는 거요,', '출근 못 하고 쉬는 거요?'] },
    { l: '쓸모없어지는 기분이 든다', s: 0, f: 'deadpan', m: [{ big: 1, t: '기분만... 드나요?' }] } ] },
  { t: '나는 내 감정을 솔직하게 표현할 수 있다.', c: [
    { l: '감정을 표현한다', s: 1, f: 'sly', m: ['그 감정이 뭔지 정확히는 몰라도 일단 발사'] },
    { l: '되도록 숨긴다', s: 0, f: 'happy', m: ['표정에서 다 드러나서 좀 역겨워요.'] } ] },
  { t: '누가 나를 싫어해도 나 자신까지 싫어할 필요는 없다.', c: [
    { l: '그건 그 사람의 감정이다', s: 1, f: 'sparkle', m: ['상대 : 나 그럼 너 맘껏 싫어해도 돼?'] },
    { l: '나도 나를 싫어하게 된다', s: 0, f: 'sparkle', m: ['헐, 나도나도!', '싫어하는 게 같으면 빨리 친해진대요~'] } ] },
  { t: '나에게는 나만의 속도가 있다.', c: [
    { l: '내 속도로 가면 된다', s: 1, f: 'smile', m: ['나만의 성취도, 나만의 성과평가,', { f: 'sly', t: '나만의 소득수준, 나만의 생활수준.' }] },
    { l: '남들과 비교하게 된다', s: 0, f: 'smile', m: ['사회에는 규격이라는 게 있지요.'] } ] },
  { t: '나는 나 자신을 있는 그대로 받아들인다.', c: [
    { l: '있는 그대로 받아들인다', s: 1, f: 'happy', m: [{ big: 1, t: '착각입니다.' }] },
    { l: '받아들이지 못한다', s: 0, f: 'deadpan', m: [{ big: 1, t: '안 받아들이면 어쩔 건데.' }] } ] },
  { t: '내 가치는 숫자로 정해지지 않는다.', c: [
    { l: '숫자로 정할 수 없다', s: 1, f: 'curious', m: ['어쨌든 정해지죠'] },
    { l: '숫자가 말해준다고 생각한다', s: 0, f: 'curious', m: [{ big: 1, t: '단위는요?' }] } ] },
  { t: '살면서 자존감이 높다는 말을 들어본 적이 있다.', c: [
    { l: '들어본 적 있다', s: 1, f: 'smile', m: ['그거 칭찬 아닌 거 아시죠?'] },
    { l: '들어본 적 없다', s: 0, f: 'deadpan', m: [{ big: 1, t: '누구신데요?' }, { f: 'happy', t: '너 있는 줄도 몰랐어~' }] } ] },
  { t: '나는 칭찬을 있는 그대로 받아들일 수 있다.', c: [
    { l: '그냥 받아들인다', s: 1, f: 'smile', m: ['말한 사람은 이미 까먹었습니다.', '둘 중 한 명은 건강하네요.'] },
    { l: '빈말인지 오래 생각한다', s: 0, f: 'curious', m: ['전봇대 아래에 떨어진 비닐봉지 보고 고양이인 줄 아신 적 있죠?'] } ] },
  { t: '나는 나 자신을 사랑한다.', c: [
    { l: '나 자신을 사랑한다', s: 1, f: 'yuck', m: ['우웩- 진짜 솔직하시다~', { f: 'smile', t: '저는 괜찮은데 어디 가서 그런 말 하면 조롱당해요.' }] },
    { l: '나 자신을 사랑하지 않는다', s: 0, f: 'sly', m: ['저런 ㅠ 근데 왜인지는 알겠다'] } ] },
  { t: '나는 남들에게 사랑받지 못한다.', c: [
    { l: '사랑받지 못한다고 느낀다', s: 0, f: 'sympathy', m: ['마치 남들이 당신을 사랑해야 한다는 말처럼 들리네요.', { f: 'sparkle', t: '자존감이 진짜진짜루 높으세요.' }] },
    { l: '사랑받고 있다고 생각한다', s: 1, f: 'deadpan', m: ['혼자 기대하고 혼자 실망하는 스타일'] } ] },
  { t: '인생의 주인공은 내가 아니다.', c: [
    { l: '나는 주인공이 아니다', s: 0, f: 'curious', m: ['인생이 영화인 줄 알았나 ㅋㅋ'] },
    { l: '내 인생에서는 내가 주인공이다', s: 1, f: 'smile', m: [{ big: 1, t: '관객은 없어요.' }] } ] },
  { t: '나는 인생의 사소한 것들을 소중히 여긴다.', c: [
    { l: '소중히 여긴다', s: 1, f: 'sparkle', m: [{ big: 1, t: '사소한 건 너겠지...' }] },
    { l: '별로 중요하지 않다', s: 0, f: 'happy', m: [{ big: 1, t: 'ㅋㅋ 너처럼' }] } ] },
  { t: '세상에 나만 이렇게 불행한 건 아니라는 사실을 알면 위로받는다.', c: [
    { l: '위로가 된다', s: 1, f: 'happy', m: ['불행 포르노가 인기 있는 이유죠~'] },
    { l: '위로되지 않는다', s: 0, f: 'sympathy', m: ['모두가 불행하면 그건 불행이 아닌데?'] } ] },
  { t: '나는 대체로 나 자신에게 만족하는 편이다.', c: [
    { l: '대체로 만족한다', s: 1, f: 'deadpan', m: [{ big: 1, t: '어쩌겠어요, 그럼.' }] },
    { l: '만족하지 않는다', s: 0, f: 'sympathy', m: ['그래야 될 것 같아 보여요.'] } ] },
  { t: '가끔은 내가 아무짝에도 쓸모없는 사람처럼 느껴진다.', c: [
    { l: '가끔은 그렇다', s: 0, f: 'sly', m: ['가끔만? ㅋ'] },
    { l: '그렇게 느끼지 않는다', s: 1, f: 'deadpan', m: ['이미 초월해서 이제 누가 지적도 안 하는 상태.'] } ] },
  { t: '나는 적어도 남들만큼은 괜찮은 사람이라고 생각한다.', c: [
    { l: '남들만큼은 괜찮다', s: 1, f: 'curious', m: ['남들이 얼마만큼 괜찮은지 측정하고 계셨나요?'] },
    { l: '남들만큼 괜찮지는 않다', s: 0, f: 'sparkle', m: ['이상하다 근데 왜케 내심 괜찮다고 생각하는 거 같지'] } ] },
  { t: '남들 시선이 신경 쓰여서 하고 싶은 말을 못 할 때가 있다.', c: [
    { l: '하고 싶은 말을 참는다', s: 0, f: 'happy', m: ['수동공격 난사하는 사람의 사고방식'] },
    { l: '그냥 말한다', s: 1, f: 'deadpan', m: [{ big: 1, t: '하든지 말든지.' }] } ] },
  { t: '나에게는 내세울 만한 장점이 몇 가지 있다.', c: [
    { l: '몇 가지 있다', s: 1, f: 'happy', m: ['안 궁금하네요^^', { f: 'smile', t: '내세우지 마세요.' }] },
    { l: '딱히 없다', s: 0, f: 'sparkle', m: ['그래도 너 그거 잘하잖아.', '그거 뭐더라 암튼.'] } ] },
  { t: '실수하면 그 생각이 며칠씩 머릿속을 떠나지 않는다.', c: [
    { l: '며칠씩 생각한다', s: 0, f: 'smile', m: ['마조 성향인가요? 자존감이 마비된 듯'] },
    { l: '금방 잊는다', s: 1, f: 'smile', m: [{ big: 1, t: '남들이 대신 기억해주니깐~' }] } ] },
  { t: '처음 만나는 사람들 앞에서도 크게 주눅 들지 않는다.', c: [
    { l: '별로 주눅 들지 않는다', s: 1, f: 'smile', m: ['상대방: [w:“네? 그런 사람이 있었나요?”]'] },
    { l: '많이 긴장한다', s: 0, f: 'smile', m: [{ big: 1, t: '근데 왜 얼쩡거리지...?' }] } ] },
  { t: '남들과 나를 비교하면 대체로 내가 부족하다는 결론이 난다.', c: [
    { l: '내가 부족한 편이다', s: 0, f: 'sympathy', m: ['그렇다고 억울해하진 마~ 보기 추하니까~'] },
    { l: '내가 부족하다고 생각하지 않는다', s: 1, f: 'sly', m: ['비교 대상을 잘 고르시네요.'] } ] },
  { t: '힘든 일이 생겨도 결국에는 어떻게든 해낼 거라고 믿는다.', c: [
    { l: '어떻게든 해낼 것이다', s: 1, f: 'smile', m: ['[w:“이거 이렇게 하시면 다른 사람이 다 다시 해야 돼요…”]'] },
    { l: '잘 해낼 자신이 없다', s: 0, f: 'deadpan', m: ['자신이 있는지 없는지는 안 궁금하고요.', '언제까지 끝내실 건데요?'] } ] },
  { t: '거울을 보면 마음에 드는 부분보다 안 드는 부분이 먼저 보인다.', c: [
    { l: '안 드는 부분이 먼저 보인다', s: 0, f: 'sparkle', m: ['오, 진짜? 그럼 마음에 드는 부분은 어딘데? 말해줘, 말해줘.', { k: 'aside', t: '(바로 단톡방 열었음)' }] },
    { l: '마음에 드는 부분이 먼저 보인다', s: 1, f: 'sparkle', m: ['ㅋㅋ 개웃기네 어디?'] } ] },
  { t: '내 생각이 틀렸을까 봐 의견 내는 것을 자주 망설인다.', c: [
    { l: '틀릴까 봐 망설인다', s: 0, f: 'deadpan', m: ['어 틀렸으니까 다음부턴 망설이지 말고 그냥 조용~'] },
    { l: '일단 의견을 말한다', s: 1, f: 'smile', m: ['[w:“저기, 저분 꼭 회의에 들어와야 되나요?”]'] } ] },
  { t: '전체적으로 나는 실패자보다 그럭저럭 잘해온 사람에 가깝다.', c: [
    { l: '그럭저럭 잘해왔다', s: 1, f: 'sparkle', m: ['누가 그래.', '아, 혼자 생각한 거라고? ㅇㅋ'] },
    { l: '실패자에 가깝다', s: 0, f: 'sweat', m: ['진심이지? 위로받으려고 하는 소리 아니지?', '설마 이거 위로해줘야 하는 타이밍이야?'] } ] },
  { t: '나는 존중받을 자격이 있는 사람이라고 느낀다.', c: [
    { l: '존중받을 자격이 있다', s: 1, f: 'happy', m: [{ sing: 1, t: '당신은~ 존중받기 위해 태어난 사람~' }] },
    { l: '그런 자격이 없는 것 같다', s: 0, f: 'deadpan', m: ['뭐, 사실 니가 자격이 있든 없든 안 하긴 해.'] } ] },
  { t: '혼자 있으면 내 안 좋은 점들만 계속 곱씹게 된다.', c: [
    { l: '계속 곱씹는다', s: 0, f: 'smile', m: ['근데 왜 계속 그 모양이에요?'] },
    { l: '금방 다른 생각을 한다', s: 1, f: 'happy', m: ['집중력 낮아서 다행이야~'] } ] },
  { t: '점수가 낮게 나와도 나는 괜찮다.', c: [
    { l: '낮아도 괜찮다', s: 1, f: 'smile', m: ['일을 좀 못해도 나는 괜찮아요.', { f: 'happy', t: '남들만 좀 참으면 돼요.' }] },
    { l: '낮게 나오면 신경 쓰인다', s: 0, f: 'deadpan', m: [{ big: 1, t: '근데 왜 그랬어.' }] } ] }
];'''
          text = text[:start] + new_block + text[end:]

          old_reply = "go(meek(), async () => {"
          new_reply = "go('네, 그렇군요.', async () => {"
          count = text.count(old_reply)
          if count != 1:
              raise RuntimeError(f"Expected one player-reply call, found {count}")
          text = text.replace(old_reply, new_reply, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit updated page
        shell: bash
        run: |
          rm -f .github/workflows/apply-self-esteem-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-self-esteem-update.yml
          git diff --cached --quiet && exit 0
          git commit -m "Update self-esteem dialogue"
          git push
