  --line: #d9dad3;
  --accent: #5457df;
  --accent-dark: #3e40bc;
  --soft: #f1f1ed;
  --red: #e13d31;
  --yellow: #ffe46a;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --sans: "Noto Sans KR Variable", local-sans, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}

* { box-sizing: border-box; }
html { min-width: 0; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
[hidden] { display: none !important; }
h1, h2, p { margin: 0; }
h2:focus, p:focus { outline: none; }

.shell {
  width: min(100%, 760px);
  min-height: 100svh;
  margin: 0 auto;
  padding: 28px 38px 22px;
  display: flex;
  flex-direction: column;
}
.masthead {
  min-height: 42px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  color: var(--ink);
  font-family: var(--mono);
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-decoration: none;
}
.sound-button {
  width: 40px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
  color: #5e6059;
  display: grid;
  place-items: center;
}
.sound-button:hover { border-color: #a9aaa2; }
.sound-button svg { width: 17px; height: 17px; }

main {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.screen {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 42px 46px 34px;
  box-shadow: 0 16px 42px rgba(37, 38, 33, .06);
  animation: screen-in .3s ease-out;
}
.eyebrow {
  color: var(--muted);
  font-family: var(--mono);
  font-size: .75rem;
  letter-spacing: .08em;
}
.primary-button {
  width: 100%;
  min-height: 58px;
  border: 0;
  border-radius: 6px;
  padding: 16px 20px;
  background: var(--ink);
  color: white;
  font-size: 1rem;
  font-weight: 700;
  text-align: center;
  transition: transform .12s ease, background .12s ease;
}
.primary-button:hover { background: #30312c; }
.primary-button:active { transform: translateY(2px); }
.primary-button:disabled { opacity: .5; }

.intro-screen h1 {
  margin-top: 31px;
  font-size: clamp(4rem, 10vw, 5.2rem);
  font-weight: 800;
  line-height: 1.03;
  letter-spacing: -.075em;
}
.intro-copy {
  margin-top: 28px;
  color: #5f615a;
  font-size: 1.08rem;
  line-height: 1.75;
  letter-spacing: -.03em;
}
.intro-screen .primary-button { margin-top: 52px; }
.intro-meta {
  margin-top: 18px;
  color: var(--muted);
  display: flex;
  justify-content: center;
  gap: 22px;
  font-size: .75rem;
}
.intro-meta span + span::before {
  content: "·";
  position: relative;
  left: -11px;
}

.quiz-screen {
  min-height: 610px;
  display: flex;
  flex-direction: column;
}
.progress-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}
.step {
  color: var(--muted);
  font-family: var(--mono);
  font-size: .75rem;
  font-variant-numeric: tabular-nums;
}
.step strong { color: var(--ink); font-size: .92rem; font-weight: 500; }
.question-area {
  flex: 1;
  margin: 48px 0 42px;
}
.question-number {
  margin-bottom: 15px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: .75rem;
}
#question {
  max-width: 570px;
  font-size: 2rem;
  font-weight: 720;
  line-height: 1.48;
  letter-spacing: -.045em;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.choices {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.choice {
  position: relative;
  width: 100%;
  min-height: 76px;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 17px 50px 17px 20px;
  background: white;
  color: var(--ink);
  display: flex;
  align-items: center;
  text-align: left;
  font-size: 1.02rem;
  font-weight: 650;
  line-height: 1.45;
  word-break: keep-all;
  transition: transform .12s ease, border-color .12s ease, background .12s ease;
}
.choice:hover { border-color: #989bd8; background: #f7f7ff; }
.choice:active { transform: scale(.99); }
.choice-index {
  position: absolute;
  right: 17px;
  width: 24px;
  height: 24px;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--muted);
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: .75rem;
  font-weight: 400;
}
.quiz-note {
  margin-top: 18px;
  color: var(--muted);
  font-size: .75rem;
  text-align: center;
}

.response { animation: screen-in .22s ease-out; }
.response-top { display: flex; align-items: center; margin-bottom: 12px; }
.answer-label {
  max-width: 100%;
  border-radius: 4px;
  padding: 6px 9px;
  background: #ecece7;
  color: #555750;
  font-size: .75rem;
  line-height: 1.35;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.feedback-stage {
  position: relative;
  min-height: 220px;
  padding: 28px 30px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  display: flex;
  align-items: center;
  overflow: hidden;
  isolation: isolate;
}
.feedback-stage::before,
.feedback-stage::after {
  position: absolute;
  z-index: -1;
  pointer-events: none;
}
#feedback {
  width: 100%;
  color: inherit;
  font-size: 1.3rem;
  font-weight: 650;
  line-height: 1.58;
  letter-spacing: -.035em;
  white-space: pre-line;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.response .primary-button { margin-top: 14px; background: var(--accent); }
.response .primary-button:hover { background: var(--accent-dark); }
.quiz-screen.answered { min-height: 610px; }
.quiz-screen.answered .question-area { flex: 0; margin: 28px 0 24px; }
.quiz-screen.answered #question { font-size: 1.35rem; color: #5f615a; }
.quiz-screen.answered .quiz-note { display: none; }

.align-left #feedback { text-align: left; }
.align-center #feedback { text-align: center; }
.align-right #feedback { text-align: right; }
.size-md #feedback { font-size: 1.04rem; font-weight: 580; }
.size-lg #feedback { font-size: 1.28rem; }
.size-xl #feedback { font-size: 1.62rem; line-height: 1.46; }
.size-xxl #feedback { font-size: 2.25rem; line-height: 1.28; letter-spacing: -.055em; }

.mood-clean { background: #fff; color: var(--ink); }
.mood-dark { border-color: #111; background: #111; color: #fff; }
.mood-mono { background: #eef0e9; color: #20211d; }
.mood-mono #feedback { font-family: var(--mono); letter-spacing: -.045em; }
.mood-soft { background: #eff0ff; color: #343669; }
.mood-red { border-color: var(--red); background: var(--red); color: #fff; }
.mood-yellow { border-color: #efcf3d; background: var(--yellow); color: #1a1a16; }
.mood-washed { background: #eee; color: #7a7a74; filter: saturate(.25); }
.mood-neon { border-color: #5558df; background: #5558df; color: #fff; }
.mood-outline { border: 2px solid #161712; background: white; color: #161712; }
.mood-outline::after {
  content: "";
  right: 12px;
  bottom: 12px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--ink);
}
.mood-chat { border-color: #b9d8ea; background: #e6f6ff; color: #183445; }
.mood-chat::after {
  content: "•••";
  right: 18px;
  top: 12px;
  color: #81a8bd;
  font-family: var(--mono);
  letter-spacing: 3px;
}
.mood-quote { border-color: #bfc8dd; background: #edf2ff; color: #1d2b4c; }
.mood-quote::before {
  content: "“";
  left: 16px;
  top: -20px;
  color: rgba(67, 86, 139, .12);
  font-family: Georgia, serif;
  font-size: 9rem;
  line-height: 1;
}

.motion-rise #feedback { animation: feedback-rise .42s cubic-bezier(.2,.8,.2,1) both; }
.motion-drop #feedback { animation: feedback-drop .42s cubic-bezier(.3,.9,.3,1) both; }
.motion-slam #feedback { animation: feedback-slam .34s cubic-bezier(.2,1.4,.3,1) both; }
.motion-pop #feedback { animation: feedback-pop .4s cubic-bezier(.18,1.4,.32,1) both; }
.motion-drift #feedback { animation: feedback-drift .65s ease-out both; }
.motion-shake #feedback { animation: feedback-shake .46s ease-out both; }
.motion-wobble #feedback { animation: feedback-wobble .6s ease-out both; }
.motion-blur #feedback { animation: feedback-blur .7s ease-out both; }
.motion-flicker #feedback { animation: feedback-flicker .55s steps(1,end) both; }
.motion-stretch #feedback { animation: feedback-stretch .5s cubic-bezier(.2,.9,.2,1) both; }
.motion-type #feedback { animation: feedback-type .65s ease-out both; }

.calculating-screen {
  min-height: 440px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.calculating-screen h2 {
  margin-top: 22px;
  font-size: 2.2rem;
  letter-spacing: -.05em;
}
.calculating-screen p {
  margin-top: 14px;
  color: var(--muted);
  font-size: .9rem;
}

.result-screen { padding-top: 40px; }
.result-screen h2 {
  color: var(--muted);
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .02em;
}
.score-area {
  margin-top: 6px;
  display: flex;
  align-items: baseline;
}
.score {
  font-size: clamp(6.2rem, 18vw, 8.4rem);
  font-weight: 780;
  line-height: 1.05;
  letter-spacing: -.08em;
  font-variant-numeric: tabular-nums;
}
.score-denominator {
  margin-left: 13px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 1rem;
}
.result-type {
  margin-top: 36px;
  font-size: 1.72rem;
  font-weight: 760;
  line-height: 1.42;
  letter-spacing: -.045em;
  word-break: keep-all;
}
.result-copy {
  margin-top: 12px;
  color: #5f6159;
  font-size: 1.05rem;
  line-height: 1.75;
  letter-spacing: -.025em;
  white-space: pre-line;
  word-break: keep-all;
}
.result-screen .primary-button { margin-top: 48px; }
.result-screen[data-band="max"] .score { color: #5659df; }
.result-screen[data-band="max"] .result-type { font-size: 2rem; }
.result-screen[data-band="high"] .score { color: var(--red); }
.result-screen[data-band="upper"] .score { color: #5659df; }
.result-screen[data-band="middle"] .score { color: #777972; }
.result-screen[data-band="lower"] .score { color: #8c6437; }
.result-screen[data-band="low"] .score { color: #1d1e1a; }

footer {
  padding-top: 24px;
  color: #92948c;
  display: flex;
  justify-content: space-between;
  gap: 14px;
  font-size: .75rem;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@keyframes screen-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes feedback-rise {
  from { opacity: 0; transform: translateY(28px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes feedback-drop {
  from { opacity: 0; transform: translateY(-35px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes feedback-slam {
  0% { opacity: 0; transform: scale(1.55); }
  70% { opacity: 1; transform: scale(.96); }
  100% { transform: scale(1); }
}
@keyframes feedback-pop {
  0% { opacity: 0; transform: scale(.55) rotate(-2deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}
@keyframes feedback-drift {
  from { opacity: 0; transform: translateX(34px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes feedback-shake {
  0% { opacity: 0; transform: translateX(0); }
  20% { opacity: 1; transform: translateX(-8px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(3px); }
  100% { transform: translateX(0); }
}
@keyframes feedback-wobble {
  0% { opacity: 0; transform: rotate(-4deg) scale(.88); }
  45% { opacity: 1; transform: rotate(2deg) scale(1.04); }
  75% { transform: rotate(-1deg); }
  100% { transform: rotate(0) scale(1); }
}
@keyframes feedback-blur {
  from { opacity: 0; filter: blur(13px); transform: scale(1.05); }
  to { opacity: 1; filter: blur(0); transform: scale(1); }
}
@keyframes feedback-flicker {
  0%, 18%, 44% { opacity: 0; transform: translateX(-3px); }
  9%, 30%, 55%, 100% { opacity: 1; transform: translateX(0); }
}
@keyframes feedback-stretch {
  from { opacity: 0; transform: scaleX(.45); letter-spacing: .08em; }
  to { opacity: 1; transform: scaleX(1); }
}
@keyframes feedback-type {
  from { opacity: 0; clip-path: inset(0 100% 0 0); }
  to { opacity: 1; clip-path: inset(0 0 0 0); }
}

@media (min-width: 1100px) {
  .shell { padding-top: 38px; padding-bottom: 30px; }
  .masthead { margin-bottom: 32px; }
}

@media (max-width: 600px) {
  .shell {
    width: 100%;
    padding: 16px 16px max(18px, env(safe-area-inset-bottom));
  }
  .masthead { margin-bottom: 14px; }
  .brand { font-size: .75rem; }
  .sound-button { width: 37px; height: 37px; }
  .screen { padding: 28px 24px 24px; border-radius: 10px; }
  .intro-screen h1 { margin-top: 27px; font-size: 3.55rem; }
  .intro-copy { margin-top: 23px; font-size: .98rem; }
  .intro-screen .primary-button { margin-top: 42px; }
  .intro-meta { gap: 16px; font-size: .75rem; }
  .intro-meta span + span::before { left: -8px; }
  .quiz-screen, .quiz-screen.answered { min-height: 570px; }
  .question-area { margin: 36px 0 32px; }
  #question { font-size: 1.6rem; line-height: 1.52; }
  .choice { min-height: 70px; padding: 15px 46px 15px 17px; font-size: .94rem; }
  .choice-index { right: 14px; }
  .quiz-screen.answered .question-area { margin: 23px 0 20px; }
  .quiz-screen.answered #question { font-size: 1.08rem; }
  .answer-label { font-size: .75rem; }
  .feedback-stage { min-height: 235px; padding: 25px 21px; }
  .size-md #feedback { font-size: 1rem; line-height: 1.58; }
  .size-lg #feedback { font-size: 1.08rem; }
  .size-xl #feedback { font-size: 1.34rem; }
  .size-xxl #feedback { font-size: 1.85rem; }
  .calculating-screen { min-height: 430px; }
  .calculating-screen h2 { font-size: 1.85rem; }
  .result-screen { padding-top: 30px; }
  .score { font-size: 6.4rem; }
  .score-denominator { font-size: .82rem; }
  .result-type { margin-top: 28px; font-size: 1.4rem; }
  .result-screen[data-band="max"] .result-type { font-size: 1.52rem; }
  .result-copy { font-size: .94rem; }
  .result-screen .primary-button { margin-top: 40px; }
  footer { padding-top: 19px; font-size: .75rem; }
}

@media (max-width: 350px) {
  .shell { padding-left: 10px; padding-right: 10px; }
  .screen { padding-left: 19px; padding-right: 19px; }
  .intro-screen h1 { font-size: 3.15rem; }
  #question { font-size: 1.42rem; }
  .feedback-stage { padding-left: 17px; padding-right: 17px; }
  .size-xxl #feedback { font-size: 1.62rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

      { label: '금방 다른 생각을 한다', score: 1, feedback: '집중력 낮아서 다행이야~', view: 'align-center size-xl mood-neon motion-pop', sound: 'sparkle' }
    ]
  }
];

function getResult(answers) {
  if (answers.length !== questions.length || answers.some((choice, index) => !Number.isInteger(choice) || !questions[index].choices[choice])) {
    throw new Error(`${questions.length}개의 답변이 필요합니다.`);
  }

  const positive = answers.reduce((sum, choice, index) => sum + questions[index].choices[choice].score, 0);
  const score = Math.round((positive / questions.length) * 100);

  if (score === 100) {
    return {
      score,
      type: '당신의 자존감은 20,000,000,000점입니다.',
      copy: '상위 0.000000001%.\n이 정도 자존감이면 사회생활을 졸업해도 되겠습니다.'
    };
  }
  if (score >= 80) return { score, type: '당신은 자존감 비대증!', copy: '다이어트 좀 하세요.' };
  if (score >= 60) return { score, type: '당신은 자신을 사랑합니다!', copy: '그 사실을 남들에게 들키지 마세요.\n조롱당하고 싶지 않다면.' };
  if (score >= 40) return { score, type: '당신은 평균입니다!', copy: '노잼.' };
  if (score >= 20) return { score, type: '당신은 겸손한 게 아닙니다!', copy: '남들보다 반박자 빠르게 자기비하를 하는 당신.\n하지만 세상은 점점 더 빨라지고 있죠.' };
  return { score, type: '당신은 자기연민하는 나르시시스트!', copy: '싫어한다면서 하루 종일 자기 생각만 합니다.' };
}

const $ = id => document.getElementById(id);
const screens = ['intro', 'quiz', 'calculating', 'result'];
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const phaseNames = ['자기 인식', '타인의 시선', '사랑과 쓸모', '비교와 사회생활', '최종 확인'];
let answers = [];
let phase = 'intro';
let soundEnabled = true;
let audio;
let master;
let noiseBuffer;
let calculationTimer;
let animationFrame;

const speaker = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4V4Z"/>';

function drawSound() {
  $('sound').innerHTML = speaker + (soundEnabled
    ? '<path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>'
    : '<path d="m16 9 5 6m0-6-5 6"/>') + '</svg>';
  $('sound').setAttribute('aria-pressed', String(soundEnabled));
  $('sound').setAttribute('aria-label', soundEnabled ? '소리 끄기' : '소리 켜기');
  $('sound').title = soundEnabled ? '소리 끄기' : '소리 켜기';
}

function ensureAudio() {
  if (!soundEnabled) return false;
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (!master) {
      master = audio.createGain();
      master.gain.value = 0.42;
      const compressor = audio.createDynamicsCompressor();
      compressor.threshold.value = -18;
      compressor.knee.value = 12;
      compressor.ratio.value = 8;
      master.connect(compressor);
      compressor.connect(audio.destination);
    }
    if (audio.state === 'suspended') void audio.resume().catch(() => {});
    return true;
  } catch {
    return false;
  }
}

function stereo(pan = 0) {
  if (!audio.createStereoPanner) return master;
  const node = audio.createStereoPanner();
  node.pan.value = Math.max(-1, Math.min(1, pan));
  node.connect(master);
  return node;
}

function osc({ delay = 0, duration = .12, from = 440, to = from, type = 'sine', volume = .08, pan = 0 }) {
  const start = audio.currentTime + delay;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(Math.max(1, from), start);
  oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, to), start + duration);
  gain.gain.setValueAtTime(.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + Math.min(.012, duration / 4));
  gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
  oscillator.connect(gain);
  gain.connect(stereo(pan));
  oscillator.start(start);
  oscillator.stop(start + duration + .02);
}

function noise({ delay = 0, duration = .12, volume = .06, frequency = 1200, endFrequency = frequency, type = 'bandpass', pan = 0 }) {
  const start = audio.currentTime + delay;
  if (!noiseBuffer) {
    noiseBuffer = audio.createBuffer(1, Math.ceil(audio.sampleRate * .75), audio.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  const source = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  source.buffer = noiseBuffer;
  filter.type = type;
  filter.Q.value = 1.2;
  filter.frequency.setValueAtTime(Math.max(20, frequency), start);
  filter.frequency.exponentialRampToValueAtTime(Math.max(20, endFrequency), start + duration);
  gain.gain.setValueAtTime(.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + .01);
  gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
  source.connect(filter);
  filter.connect(gain);
  gain.connect(stereo(pan));
  source.start(start);
  source.stop(start + duration + .02);
}

function playSound(name) {
  if (!ensureAudio()) return;
  const note = (freq, delay, options = {}) => osc({ from: freq, to: freq, delay, ...options });
  switch (name) {
    case 'shine':
      [620, 830, 1240].forEach((freq, i) => note(freq, i * .055, { duration: .2, volume: .07, pan: i - 1 }));
      break;
    case 'drop':
      osc({ from: 360, to: 64, duration: .28, type: 'triangle', volume: .13 });
      noise({ duration: .16, volume: .035, frequency: 480, endFrequency: 90, type: 'lowpass' });
      break;
    case 'crack':
      noise({ duration: .1, volume: .16, frequency: 4200, endFrequency: 900, type: 'highpass' });
      osc({ delay: .03, from: 130, to: 42, duration: .2, volume: .14 });
      break;
    case 'type':
      [0, .065, .13].forEach((delay, i) => osc({ delay, from: 780 - i * 80, to: 520, duration: .045, type: 'square', volume: .04, pan: i - 1 }));
      break;
    case 'thud':
    case 'impact':
      osc({ from: name === 'impact' ? 190 : 125, to: 38, duration: .24, volume: .19 });
      noise({ duration: .09, volume: .08, frequency: 500, endFrequency: 100, type: 'lowpass' });
      break;
    case 'choir':
      [220, 277.18, 329.63].forEach((freq, i) => note(freq, i * .035, { duration: .48, volume: .055, type: 'sine', pan: i - 1 }));
      break;
    case 'alarm':
      [0, .13].forEach(delay => {
        osc({ delay, from: 230, to: 170, duration: .11, type: 'sawtooth', volume: .09, pan: -.5 });
        osc({ delay, from: 290, to: 220, duration: .11, type: 'square', volume: .055, pan: .5 });
      });
      break;
    case 'switch':
      noise({ duration: .035, volume: .1, frequency: 5000, type: 'highpass' });
      osc({ delay: .035, from: 240, to: 780, duration: .16, type: 'triangle', volume: .08 });
      break;
    case 'rewind':
      osc({ from: 1100, to: 180, duration: .32, type: 'sawtooth', volume: .065 });
      noise({ duration: .28, volume: .035, frequency: 2800, endFrequency: 300 });
      break;
    case 'sting':
      osc({ from: 940, to: 160, duration: .18, type: 'square', volume: .08 });
      break;
    case 'void':
      noise({ duration: .42, volume: .04, frequency: 700, endFrequency: 90, type: 'lowpass' });
      osc({ from: 74, to: 48, duration: .42, volume: .07 });
      break;
    case 'sparkle':
      [980, 1320, 1760, 2220].forEach((freq, i) => note(freq, i * .04, { duration: .12, volume: .045, type: 'sine', pan: i % 2 ? .8 : -.8 }));
      break;
    case 'cascade':
      [880, 660, 495, 330].forEach((freq, i) => note(freq, i * .045, { duration: .13, volume: .055, type: 'triangle', pan: .8 - i * .5 }));
      break;
    case 'stamp':
      osc({ from: 160, to: 48, duration: .18, volume: .17 });
      noise({ duration: .055, volume: .12, frequency: 800, type: 'lowpass' });
      break;
    case 'pop':
      osc({ from: 210, to: 680, duration: .13, volume: .11 });
      break;
    case 'digital':
      [440, 660, 880].forEach((freq, i) => note(freq, i * .045, { duration: .075, volume: .055, type: 'square' }));
      break;
    case 'ping':
      note(1180, 0, { duration: .32, volume: .08 });
      break;
    case 'fanfare':
      [392, 523.25, 659.25, 783.99].forEach((freq, i) => note(freq, i * .06, { duration: .28, volume: .06, type: i % 2 ? 'triangle' : 'sine', pan: i % 2 ? .6 : -.6 }));
      break;
    case 'murmur':
      [0, .07, .14].forEach((delay, i) => noise({ delay, duration: .1, volume: .035, frequency: 500 + i * 160, type: 'bandpass', pan: i - 1 }));
      break;
    case 'notification':
      note(740, 0, { duration: .12, volume: .075 });
      note(1030, .09, { duration: .2, volume: .065 });
      break;
    case 'whoosh':
      noise({ duration: .32, volume: .09, frequency: 180, endFrequency: 4200, type: 'bandpass', pan: -.7 });
      break;
    case 'glitch':
      [0, .035, .075, .12].forEach((delay, i) => osc({ delay, from: i % 2 ? 1180 : 240, to: i % 2 ? 180 : 1420, duration: .055, type: 'square', volume: .045, pan: i % 2 ? 1 : -1 }));
      break;
    case 'slide':
      osc({ from: 620, to: 260, duration: .32, type: 'triangle', volume: .075, pan: .8 });
      break;
    case 'laser':
      osc({ from: 1600, to: 72, duration: .34, type: 'sawtooth', volume: .1, pan: -.8 });
      osc({ delay: .04, from: 900, to: 120, duration: .28, type: 'square', volume: .045, pan: .8 });
      break;
    case 'descending':
      [520, 390, 292].forEach((freq, i) => note(freq, i * .09, { duration: .18, volume: .06, type: 'triangle' }));
      break;
    case 'swipe':
      noise({ duration: .2, volume: .09, frequency: 5000, endFrequency: 400, type: 'highpass', pan: 1 });
      break;
    case 'error':
      [0, .12].forEach(delay => osc({ delay, from: 185, to: 160, duration: .095, type: 'square', volume: .075 }));
      break;
    case 'launch':
      osc({ from: 110, to: 720, duration: .36, type: 'sawtooth', volume: .08, pan: -.8 });
      osc({ delay: .08, from: 160, to: 1200, duration: .3, type: 'triangle', volume: .07, pan: .8 });
      noise({ delay: .05, duration: .28, volume: .055, frequency: 240, endFrequency: 5000, pan: 0 });
      break;
    case 'result':
      [261.63, 329.63, 392, 523.25].forEach((freq, i) => note(freq, i * .09, { duration: .5, volume: .07, type: i < 2 ? 'triangle' : 'sine', pan: i % 2 ? .7 : -.7 }));
      noise({ delay: .2, duration: .32, volume: .04, frequency: 500, endFrequency: 6000, type: 'bandpass' });
      break;
    default:
      osc({ from: 620, to: 510, duration: .08, type: 'triangle', volume: .06 });
  }
}

function showScreen(name, focusId) {
  screens.forEach(id => $(id).hidden = id !== name);
  phase = name;
  window.scrollTo({ top: 0, behavior: 'auto' });
  if (focusId) $(focusId).focus({ preventScroll: true });
}

function renderQuestion() {
  const index = answers.length;
  const item = questions[index];
  const phaseIndex = Math.min(phaseNames.length - 1, Math.floor(index / Math.ceil(questions.length / phaseNames.length)));
  $('quiz').classList.remove('answered');
  $('step').textContent = String(index + 1).padStart(2, '0');
  $('step-total').textContent = ` / ${questions.length}`;
  $('question-number').textContent = `Q.${String(index + 1).padStart(2, '0')}`;
  $('phase-label').textContent = phaseNames[phaseIndex];
  $('question').textContent = item.text;
  $('choices').hidden = false;
  $('response').hidden = true;
  $('feedback-stage').className = 'feedback-stage';
  item.choices.forEach((choice, choiceIndex) => {
    const button = document.querySelector(`[data-choice="${choiceIndex}"]`);
    button.querySelector('.choice-text').textContent = choice.label;
    button.disabled = false;
  });
  $('next').disabled = false;
  showScreen('quiz', 'question');
}

function answer(choiceIndex) {
  if (phase !== 'quiz' || !$('response').hidden || answers.length >= questions.length) return;
  const item = questions[answers.length];
  const choice = item.choices[choiceIndex];
  if (!choice) return;
  answers.push(choiceIndex);
  document.querySelectorAll('[data-choice]').forEach(button => button.disabled = true);
  $('choices').hidden = true;
  $('response').hidden = false;
  $('quiz').classList.add('answered');
  $('answer-label').textContent = choice.label;
  $('feedback').textContent = choice.feedback;
  $('feedback-stage').className = `feedback-stage ${choice.view}`;
  $('next').textContent = answers.length === questions.length ? '결과 보기' : '다음';
  $('announcer').textContent = choice.feedback;
  playSound(choice.sound);
  $('feedback').focus({ preventScroll: true });
}

function next() {
  if (phase !== 'quiz' || $('response').hidden || $('next').disabled) return;
  $('next').disabled = true;
  playSound('tick');
  if (answers.length < questions.length) {
    renderQuestion();
    return;
  }
  $('calculation-count').textContent = `${questions.length} / ${questions.length}`;
  showScreen('calculating', 'calculation-title');
  calculationTimer = setTimeout(renderResult, reducedMotion.matches ? 100 : 950);
}

function renderResult() {
  const result = getResult(answers);
  $('result-type').textContent = result.type;
  $('result-copy').textContent = result.copy;
  $('score').textContent = reducedMotion.matches ? result.score : '0';
  $('result').dataset.band = result.score === 100 ? 'max' : result.score >= 80 ? 'high' : result.score >= 60 ? 'upper' : result.score >= 40 ? 'middle' : result.score >= 20 ? 'lower' : 'low';
  showScreen('result', 'result-title');
  $('announcer').textContent = `자존감 점수 ${result.score}점. ${result.type}. ${result.copy}`;
  playSound('result');
  if (!reducedMotion.matches) {
    const started = performance.now();
    function count(now) {
      const progress = Math.min((now - started) / 800, 1);
      $('score').textContent = Math.round(result.score * (1 - Math.pow(1 - progress, 3)));
      if (progress < 1) animationFrame = requestAnimationFrame(count);
    }
    animationFrame = requestAnimationFrame(count);
  }
}

function start() {
  clearTimeout(calculationTimer);
  cancelAnimationFrame(animationFrame);
  answers = [];
  $('announcer').textContent = '';
  playSound('launch');
  renderQuestion();
}

$('start').addEventListener('click', start);
$('restart').addEventListener('click', start);
$('next').addEventListener('click', next);
$('choices').addEventListener('click', event => {
  const button = event.target.closest('[data-choice]');
  if (button) answer(Number(button.dataset.choice));
});
$('sound').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  if (!soundEnabled && audio) void audio.suspend().catch(() => {});
  drawSound();
  if (soundEnabled) playSound('shine');
});

document.addEventListener('keydown', event => {
  if (event.repeat || event.altKey || event.ctrlKey || event.metaKey || event.target.closest('button, a, input, textarea, select')) return;
  if (phase === 'quiz' && $('response').hidden && (event.key === '1' || event.key === '2')) {
    event.preventDefault();
    answer(Number(event.key) - 1);
  } else if (phase === 'quiz' && !$('response').hidden && event.key === 'Enter') {
    event.preventDefault();
    next();
  }
});

drawSound();

  </script>
</body>
